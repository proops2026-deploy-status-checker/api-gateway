name: IaC PR Merged — Apply
on:
  push:
    branches: [master]
    paths: ['iac/**']
jobs:
  iac-apply:
    uses: proops2026-deploy-status-checker/proops2026-cicd-platform/.github/workflows/reusable-iac.yml@v1
    with:
      action: apply
      environment: dev
      working-directory: iac/dev
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
