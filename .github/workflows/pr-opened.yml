name: PR Open — App CI
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
jobs:
  app-ci:
    uses: proops2026-deploy-status-checker/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v1
    with:
      image-name: tert62/dsc-api-gateway
      image-tag: ${{ github.sha }}
      test-script: test:coverage
      push-image: false # PR = build only; no registry secrets passed
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
