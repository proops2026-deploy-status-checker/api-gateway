name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  IMAGE: tert62/dsc-api-gateway

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      # Same tests as `npm test`, built with source maps and wrapped in c8 so
      # coverage of the spawned gateway maps back to src/ (coverage/lcov.info)
      - run: npm run test:coverage

      # Handed to the sonar job; only needed within this run
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Reads package-lock.json only — no npm ci needed (verified locally, Day 24)
      - run: npm audit --audit-level=critical

  # Runs in parallel with build-image; the ruleset (not needs:) blocks the merge
  sonar:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: Sonar uses blame + the merge base with master to tell new code from old
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      # Reads sonar-project.properties; v8.3.0 pinned by commit SHA (third-party action)
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-image:
    needs: [lint, test, audit]
    runs-on: ubuntu-latest
    env:
      # PRs build only (proves the Dockerfile); only master pushes to the registry
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          # Full commit SHA only — no :latest (traceable, never a moving target)
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-image]
    # Pulls the image build-image pushed — that only happens on master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      NAMESPACE: deploy-status-checker
    steps:
      - uses: actions/checkout@v4

      # Ephemeral cluster inside the runner — dies with the job
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci-${{ github.run_id }}
          wait: 120s

      # Throwaway values: the Pod only needs the keys to exist; real secrets never enter a test cluster
      - name: Create namespace and throwaway secret
        run: |
          kubectl create namespace "$NAMESPACE"
          JWT_SECRET=$(openssl rand -hex 32)
          CI_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$CI_API_KEY"
          kubectl create secret generic api-gateway-secret -n "$NAMESPACE" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=CI_API_KEY="$CI_API_KEY"

      - name: Apply manifests with the new image
        run: |
          sed -i "s|image: .*|image: ${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          grep -n "image:" k8s/deployment.yaml
          kubectl apply -f k8s/

      - name: Wait for rollout
        run: kubectl rollout status deployment/api-gateway -n "$NAMESPACE" --timeout=180s

      - name: Show running image (evidence)
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl describe pod -n "$NAMESPACE" -l app=api-gateway | grep -E "Image:|Status:"

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp
          kubectl describe pod -n "$NAMESPACE" -l app=api-gateway
          kubectl logs -n "$NAMESPACE" -l app=api-gateway --tail=50 || true
