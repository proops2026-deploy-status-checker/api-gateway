<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Deploy Status Checker</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Deploy Status Checker</span>
      </div>
      <nav class="tabs" aria-label="Views">
        <a href="#/overview" data-tab="overview">Overview</a>
        <a href="#/history" data-tab="history">History</a>
      </nav>
      <form id="token-form" class="token" autocomplete="off">
        <label class="visually-hidden" for="token-input">Access token (JWT)</label>
        <input id="token-input" type="password" placeholder="Paste access token (JWT)" spellcheck="false" />
        <button type="submit" class="btn">Use token</button>
        <button type="button" id="token-clear" class="btn btn-quiet" hidden>Sign out</button>
        <span id="token-status" class="token-status" role="status"></span>
      </form>
    </header>

    <main id="view" tabindex="-1" aria-live="polite"></main>

    <footer class="footer">
      Read-only view. CI reports deploys and logs; nothing here changes a deployment.
      Token is kept for this tab only.
    </footer>
  </body>
</html>
