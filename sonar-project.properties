# SonarCloud config for CI-based analysis (read by the scan action in ci.yml).
# Automatic Analysis ignores this file; it reads .sonarcloud.properties instead.

sonar.projectKey=proops2026-deploy-status-checker_api-gateway
sonar.organization=proops2026-deploy-status-checker

# Production code: the TypeScript app plus the container/K8s definitions,
# so Sonar's Docker and Kubernetes rules also run (they add no coverage lines).
sonar.sources=src,Dockerfile,k8s

# Tests live in their own folder, so no sonar.test.inclusions is needed.
sonar.tests=test

# Build output, deps and reports are never source. Redundant while sources is
# limited to src/, but protects the scan if sources is ever widened to ".".
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# LCOV report written by the test job (Q4). Covers both JS and TS;
# sonar.typescript.lcov.reportPaths is deprecated.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
